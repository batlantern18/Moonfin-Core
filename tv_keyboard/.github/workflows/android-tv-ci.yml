name: Android TV CI

on:
  push:
    paths:
      - 'tv_keyboard/**'
      - '.github/workflows/android-tv-ci.yml'
  pull_request:
    paths:
      - 'tv_keyboard/**'
      - '.github/workflows/android-tv-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build and test
        working-directory: tv_keyboard
        run: ../gradlew :app:assembleDebug :app:testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: tv_keyboard/app/build/outputs/apk/debug/app-debug.apk
