name: Android TV keyboard

on:
  push:
    paths:
      - 'tv_keyboard/**'
      - '.github/workflows/android-tv-ci.yml'
  pull_request:
    paths:
      - 'tv_keyboard/**'
      - '.github/workflows/android-tv-ci.yml'

jobs:
  build-and-test:
    name: Build and test the TV keyboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv_keyboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('tv_keyboard/**/*.gradle*', 'tv_keyboard/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-keyboard-debug-apk
          path: tv_keyboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-keyboard-test-reports
          path: tv_keyboard/app/build/reports/tests/
          if-no-files-found: ignore
