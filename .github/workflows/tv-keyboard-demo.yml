name: TV keyboard demo

on:
  push:
    paths:
      - 'tv_keyboard_demo/**'
      - '.github/workflows/tv-keyboard-demo.yml'
  pull_request:
    paths:
      - 'tv_keyboard_demo/**'
      - '.github/workflows/tv-keyboard-demo.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv_keyboard_demo
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
